# ==================================================================
#  IT SUPPORT PAGE SETTINGS AND CATEGORIES
#  This file controls everything on the IT support page.
#  Edit the words here and commit. You don't need to touch the page itself.
#
#  Tips:
#  - Keep the spaces at the start of each line exactly as they are.
#  - Put text in "double quotes" if it contains a colon (:) or #.
#  - To add a category, copy a whole block starting with "- id:" and
#    give it a new id (lowercase, dashes, no spaces).
# ==================================================================

# The Microsoft Form for support tickets. Use the normal share link
# (Collect responses > Copy link). One form with branching is recommended,
# see FORM-BLUEPRINT.md. Leave blank until the form exists.
ticket_form_url: ""

# Shown in the red "urgent" box at the top of the page.
urgent_phone: ""            # e.g. "07 3870 0849"
urgent_email: ""            # e.g. "it-help@cohogroup.com.au"

# Improvement request form (already exists in Microsoft Forms).
improvement:
  # Normal link, used for the "Open the form" button
  form_url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5URTBYOFRKMUFDTDg4WjgzN09NUlpUSURXTyQlQCN0PWcu"
  # Set to true to also show the form inside the page.
  # Only works if the form is set to "Anyone can respond".
  embed: true

# ------------------------------------------------------------------
#  SUPPORT CATEGORIES
#  title:      what staff click on
#  summary:    one line under the title
#  examples:   short examples so people pick the right one
#  have_ready: what to gather before opening the form
#  form_asks:  the questions the form asks for this category
#              (build these into the matching section of your Microsoft Form)
#  notice:     optional highlighted note
#  form_url:   optional, a different form just for this category
#  sign_in:    true if the form only accepts Coho work accounts
#  forms:      a list of forms to fill in order (see new-starter). Use instead of form_url.
#  skip_common: true hides the shared "common_asks" questions for this category
# ------------------------------------------------------------------
categories:

  - id: new-starter
    title: "Set up a new starter"
    skip_common: true
    summary: "Line managers: onboard someone joining Coho Group, then request their IT equipment, software and access."
    examples: "New employee, contractor or transfer from another site"
    notice: "Please lodge at least 10 business days before the start date, so equipment can be ordered and tested. Both forms need you to sign in with your Coho work account."
    have_ready:
      - "Starter's first name, surname, position title and start date"
      - "Starter's home email and address for payroll preparation"
      - "Their department, desk or location, and whether they're in the office or hybrid"
      - "Cost centre for equipment"
      - "Which software, systems, shared mailboxes and Teams channels they need"
      - "Position title, department, start date and end date (if a fixed term)"
      - "Whether they're an office or non-office user"
      - "For IT equipment: desk or location, office or hybrid, cost centre, and the software and access they need"
    # Two forms, filled in one after the other. Add or remove blocks to change the steps.
    forms:
      - title: "Request for Coho Group new starter"
        url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5UN1BOVFpLM04zMUlXUFpGNkVNWFYxUDQ3RCQlQCN0PWcu"
        when: "Everyone starts here. Personal details are used for onboarding only."
        asks:
          - q: "First name and surname"
          - q: "Date of birth"
          - q: "Residential address"
          - q: "Personal email address (for payroll links)"
          - q: "Position title"
          - q: "Department"
            options: "HSE · Drilling Fluids · Steelhead · QICR · MANTL · Resources · Inspections · Finance/corporate"
          - q: "Start date, and end date if fixed term"
          - q: "What level of technology access is required?"
            options: "Office user · Non-office user"
          - q: "Do you need to request IT hardware for the new starter?"
          - q: "Any other information required"
      - title: "Request for IT hardware and software installation"
        url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5UNkhUTldDU1dXNzE5VUZCNTNNMDBLNDM0RiQlQCN0PWcu"
        when: "Only if the starter needs IT equipment or software. Fill it in straight after form 1."
        asks:
          - q: "Department, starter's name, position title and start date"
          - q: "Line manager"
          - q: "Desk / location"
          - q: "Work pattern"
            options: "Office · Hybrid"
          - q: "Cost centre for equipment"
          - q: "Equipment required (tick all that apply)"
            options: "Laptop · Docking station · Monitors x2 and cables · Monitor arm · Keyboard and mouse · Headset · Webcam · Laptop bag · Spare charger"
          - q: "Other equipment needed"
          - q: "Software and system access required"
          - q: "Do they need a phone number or mobile phone?"
            options: "Desk phone or softphone number · Mobile phone · Both · Neither · Not sure"
          - q: "Anything else IT should know?"

  - id: software
    title: "Software problem or question"
    form_url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5UME1KSVBaRExEMzVPUTZKME1SSVhaQVRWNiQlQCN0PWcu"
    summary: "Something isn't working in a program, or you need help using it."
    examples: "Outlook won't send, Excel keeps crashing, can't join a Teams call"
    have_ready:
      - "The name of the software"
      - "A screenshot or photo of any error message"
      - "Roughly when it started"
    form_asks:
      - q: "Which software is the issue occurring in?"
        options: "Outlook · Teams · Excel · Word · OneDrive or SharePoint · Accounting system · Driver app or website · Other"
      - q: "What were you trying to do when it happened?"
      - q: "What happened instead? Copy any error message word for word"
      - q: "When did it start?"
        options: "Today · This week · Longer ago · It's always been like this"
      - q: "Is it just you, or are others affected too?"
      - q: "Which device were you using?"
        options: "Work laptop · Work phone · Personal phone · Site or shared computer"
      - q: "Upload a screenshot (optional)"
      - q: "Is this a problem, or a how-do-I question?"

  - id: hardware
    title: "Laptop, phone or equipment problem"
    form_url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5UQlRXQ0pFTU5XOEJEMDkwTlFVOURWWkkyWSQlQCN0PWcu"
    summary: "A device is broken, slow, damaged or not connecting."
    examples: "Laptop won't turn on, monitor not displaying, headset not working"
    have_ready:
      - "The asset tag or serial number (usually on a sticker underneath)"
      - "A photo of any damage"
    form_asks:
      - q: "What type of equipment?"
        options: "Laptop · Monitor · Docking station · Keyboard or mouse · Headset or webcam · Mobile phone · Printer or scanner · Other"
      - q: "Asset tag or serial number"
      - q: "What's wrong with it?"
      - q: "Is it damaged, lost or stolen?"
      - q: "Upload a photo (optional)"

  - id: account
    title: "Sign-in, password or Authenticator"
    form_url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5UQjRJTjVGSldOTFFZOU1HTThQRTFST1A0NCQlQCN0PWcu"
    summary: "You can't sign in, or need help with the phone approval."
    examples: "Forgotten password, new phone, Authenticator not prompting"
    notice: "Never type your password into the form. IT will never ask for it."
    have_ready:
      - "A phone number IT can call you on"
      - "Whether you've changed phones recently"
    form_asks:
      - q: "What's happening?"
        options: "Forgotten password · Account locked · Authenticator app not working · Got a new phone · Something else"
      - q: "Which account or system?"
      - q: "Best phone number to reach you"
      - q: "When are you available for a call?"

  - id: access
    title: "Access to a folder, mailbox or system"
    form_url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5UMDFHRUZOSjE0RERMVFdaM1VXWUo2UE5HUiQlQCN0PWcu"
    summary: "You need access to something, or someone else's access needs changing."
    examples: "Need the debtors folder, add me to a shared mailbox, remove a leaver"
    notice: "Access requests need your manager's approval. Include their name so IT can check with them."
    have_ready:
      - "The exact name or link of the folder, mailbox, Teams channel or system"
      - "Your manager's name"
    form_asks:
      - q: "Who needs the access?"
      - q: "What do they need access to? Paste the link if you have one"
      - q: "What level of access?"
        options: "View only · Edit · Remove access"
      - q: "Why is it needed?"
      - q: "Approving manager"
      - q: "Is it needed by a particular date?"

  - id: other
    title: "Something else"
    form_url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=5qkJ-EdlJUaJ97MnKR-lntTIaazKlYtOvymRqNu7cs5UM0IzVVVVRlVGVTVCNFFFTUlKRTdNNENRUiQlQCN0PWcu"
    summary: "Not sure where it fits? Tell us here and we'll sort it."
    examples: "Website, printing, ordering equipment, general questions"
    have_ready:
      - "As much detail as you can, and a screenshot if it helps"
    form_asks:
      - q: "Describe what you need"
      - q: "Upload a screenshot or file (optional)"

# Questions the form asks everyone, whatever the category
common_asks:
  - q: "Your name"
  - q: "Site or office"
  - q: "How much is this affecting your work?"
    options: "I can't work · I can work but it's slowing me down · No rush, just a question"
