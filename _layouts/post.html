---
layout: default
---
<article class="post">
  <p class="back"><a href="{{ '/' | relative_url }}">&larr; All news</a></p>
  <header class="post-header">
    {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.author %} · {{ page.author }}{% endif %}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <aside class="ask-box">
    <p><strong>Got a question about this?</strong> We'd rather you ask than guess.</p>
    <a class="button" href="{{ '/ask/' | relative_url }}">Ask a question</a>
  </aside>
</article>
